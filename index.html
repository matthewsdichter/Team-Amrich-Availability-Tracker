<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Amrich Availability Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232a78d6'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3ETA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="js/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css?v=20260825a">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1>Team Amrich</h1>
        <span class="brand-sub">Availability Tracker</span>
      </div>
      <div class="header-stats" id="header-stats" aria-label="Portfolio summary">
        <div class="stat-tile">
          <span class="stat-label">Buildings</span>
          <span class="stat-value" id="stat-buildings">0</span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">Available spaces</span>
          <span class="stat-value" id="stat-spaces">0</span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">Total available RSF</span>
          <span class="stat-value" id="stat-rsf">0</span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">Largest contiguous block</span>
          <span class="stat-value" id="stat-block">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Search / filter bar -->
  <section class="filter-bar" aria-label="Search filters">
    <div class="filter-inner">
      <div class="size-fields">
        <label class="size-field">
          <span>Min SF</span>
          <input type="text" inputmode="numeric" id="min-sf" class="input" placeholder="e.g. 15,000">
        </label>
        <span class="size-dash" aria-hidden="true">&ndash;</span>
        <label class="size-field">
          <span>Max SF</span>
          <input type="text" inputmode="numeric" id="max-sf" class="input" placeholder="e.g. 25,000">
        </label>
      </div>

      <div class="condition-chips" role="group" aria-label="Space condition">
        <button type="button" class="chip" data-condition="wb-raw">Whiteboxed / Raw</button>
        <button type="button" class="chip" data-condition="2nd-gen">2nd Gen</button>
        <button type="button" class="chip" data-condition="prebuilt">Prebuilt</button>
      </div>

      <label class="toggle-immediate">
        <input type="checkbox" id="immediate-only">
        <span>Immediate only</span>
      </label>

      <button type="button" class="btn btn-ghost" id="btn-clear">Clear</button>
      <span class="result-summary" id="result-summary"></span>
    </div>
  </section>

  <main class="app-main">
    <div class="split" id="split" data-view="list">
      <section class="map-pane" aria-label="Map of availabilities">
        <div id="map"></div>
      </section>
      <section class="results-pane" aria-label="Search results">
        <div id="results"></div>
      </section>
    </div>
    <nav class="mobile-toggle" aria-label="Switch between list and map">
      <button type="button" data-view="list" class="active">List</button>
      <button type="button" data-view="map">Map</button>
    </nav>
  </main>

  <script src="js/vendor/leaflet/leaflet.js"></script>
  <script src="js/data.js?v=20260825a"></script>
  <script src="js/app.js?v=20260825a"></script>
</body>
</html>
